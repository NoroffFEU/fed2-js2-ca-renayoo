<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Social Media App - Noroff FED2 JS2 CA</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script type="module" src="/src/js/main.js" defer></script>
    <script type="module" src="/src/js/api/post/delete.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <!-- Header with logo and title -->
    <header class="flex items-center justify-between p-6 bg-custom-blue text-white">
        <img src="/images/noroff-logo.png" alt="Noroff Logo" class="w-20 h-auto"/>
        <div class="text-center">
            <h1 class="text-2xl font-bold">Social Media App Assignment</h1>
        </div>
    </header>

    <!-- Navigation Menu -->
    <nav class="bg-white shadow-md">
        <div class="flex justify-center space-x-6 p-4">
            <a href="/post/create/index.html" class="text-custom-blue hover:text-blue-600">Publish Post</a>
            <a href="/profile/" class="text-custom-blue hover:text-blue-600">My Profile</a>
            <button id="logout-button" class="bg-red-600 text-white py-1 px-4 rounded hover:bg-red-700">Logout</button>
        </div>
    </nav>

    <!-- Feed Section -->
    <main class="container mx-auto p-6">
        <div class="flex justify-between mb-4">
            <!-- Search input -->
            <input type="text" id="search-input" placeholder="Search title..." class="border border-gray-300 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
    
            <!-- Filter dropdown -->
            <select id="filter-dropdown" class="border border-gray-300 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Filter by Category</option>
                <!-- Dynamically populated categories -->
            </select>
        </div>
    
        <div id="posts-container" class="space-y-6">
            <!-- Posts will be dynamically populated here -->
        </div>
    
        <div class="pagination flex justify-center space-x-2 mt-6" id="pagination-container"></div>
    </main>
    

    <!-- Footer -->
    <footer class="text-center py-4 bg-gray-800 text-white">
        <p>&copy; 2024 Social Media App - All Rights Reserved</p>
    </footer>
</body>
</html>
