<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Noroff FED2 JS2 CA - Edit Post</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <script type="module" src="/src/app.js"></script>
    <script type="module" src="/src/js/api/post/update.js"></script>
</head>
<body class="bg-lilac-100">

    <!-- Page Header -->
    <h1 class="edit-post-header text-3xl font-bold text-center mt-12 text-gray-800">Edit Post</h1>
    
    <!-- Form Container -->
    <div class="edit-post-form-container max-w-3xl mx-auto p-8 bg-white rounded-lg shadow-xl mt-8">
        <form id="edit-post-form">
            <input type="hidden" id="post-id" />

            <!-- Title Field -->
            <label for="title" class="edit-post-label block text-xl font-medium text-gray-700 mt-4">Title:</label>
            <input type="text" id="title" class="edit-post-input-field" required />

            <!-- Tags (Categories) Field -->
            <label for="tags" class="edit-post-label block text-xl font-medium text-gray-700 mt-4">Categories (comma-separated):</label>
            <input type="text" id="tags" class="edit-post-input-field" />

            <!-- Media URL Field -->
            <label for="media-url" class="edit-post-label block text-xl font-medium text-gray-700 mt-4">Media URL:</label>
            <input type="text" id="media-url" class="edit-post-input-field" required />

            <!-- Media Alt Text Field -->
            <label for="media-alt" class="edit-post-label block text-xl font-medium text-gray-700 mt-4">Media Alt Text:</label>
            <input type="text" id="media-alt" class="edit-post-input-field" required />

            <!-- Body Content Field -->
            <label for="body" class="edit-post-label block text-xl font-medium text-gray-700 mt-4">Content:</label>
            <textarea id="body" required class="edit-post-textarea-field"></textarea>

            <!-- Button Container -->
            <div class="edit-post-button-container mt-6">
                <button type="button" id="save-changes-button" class="edit-post-save-button">
                    Save Changes
                </button>
            </div>

            <!-- Delete Post Button -->
            <div class="edit-post-delete-button-container mt-4">
                <button type="button" id="delete-button" class="edit-post-delete-button">
                    Delete Post
                </button>
            </div>
        </form>
    </div>

</body>
</html>
